<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>판매글 등록 — 그림자 경매</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&family=Noto+Serif+KR:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<header class="site-header">
  <div class="site-header__inner">
    <div class="site-mark">
      <span class="site-mark__seal">品</span>
      <h1 class="site-title"><a href="index.html">그림자 <em>경매</em><small>카드 암시장</small></a></h1>
    </div>
    <nav class="nav-links">
      <a href="index.html">전체 직업</a>
      <a href="mypage.html">마이페이지</a>
    </nav>
  </div>
</header>

<main class="wrap wrap--narrow">
  <div class="section-head">
    <div>
      <h2>판매글 등록</h2>
      <p>팔 카드 정보를 입력하세요.</p>
    </div>
  </div>

  <div class="notice">한 번 등록하면 <strong>수정하거나 삭제할 수 없습니다.</strong> 직업·수량·조건을 다시 확인한 뒤 등록해주세요.</div>

  <div id="loginPrompt" class="login-prompt" style="display:none;">
    <p class="empty-state__title">로그인이 필요합니다.</p>
    <p class="empty-state__desc"><a href="mypage.html">마이페이지에서 로그인 / 회원가입</a> 후 이용해주세요.</p>
  </div>

  <form class="form-card" id="writeForm" style="display:none;">
    <label class="field">
      <span class="field__label">직업</span>
      <select class="field__input" id="jobSelect" required></select>
    </label>

    <label class="field">
      <span class="field__label">판매 수량</span>
      <input class="field__input" id="qty" type="number" min="1" value="1" required />
    </label>

    <label class="field">
      <span class="field__label">판매자</span>
      <div class="field__input" id="sellerDisplay" style="opacity:0.85;">-</div>
    </label>

    <label class="field">
      <span class="field__label">원하는 조건 <span class="field__optional">(선택)</span></span>
      <textarea class="field__input field__textarea" id="condition" placeholder="예: 청부업자 카드 우대, 엽서 추가 환영"></textarea>
    </label>

    <div class="form-actions">
      <a class="btn btn--ghost" href="index.html">취소</a>
      <button class="btn btn--gold" type="submit">판매글 등록</button>
    </div>
  </form>
</main>

<script type="module">
  import { JOBS } from "./data/jobs.js";
  import {
    db,
    auth,
    doc,
    getDoc,
    collection,
    addDoc,
    serverTimestamp,
    onAuthStateChanged,
  } from "./js/firebase-init.js";

  const params = new URLSearchParams(window.location.search);
  const presetJob = params.get("job");

  const jobSelect = document.getElementById("jobSelect");

  if (presetJob && JOBS.includes(presetJob)) {
    const opt = document.createElement("option");
    opt.value = presetJob;
    opt.textContent = presetJob;
    opt.selected = true;
    jobSelect.appendChild(opt);
    jobSelect.disabled = true;
  } else {
    JOBS.forEach((job) => {
      const opt = document.createElement("option");
      opt.value = job;
      opt.textContent = job;
      jobSelect.appendChild(opt);
    });
  }

  const loginPrompt = document.getElementById("loginPrompt");
  const form = document.getElementById("writeForm");
  const sellerDisplay = document.getElementById("sellerDisplay");
  const submitBtn = form.querySelector("button[type=submit]");

  let currentUser = null;
  let currentGameId = null;

  onAuthStateChanged(auth, async (user) => {
    if (!user) {
      currentUser = null;
      loginPrompt.style.display = "block";
      form.style.display = "none";
      return;
    }
    currentUser = user;
    const userSnap = await getDoc(doc(db, "users", user.uid));
    currentGameId = userSnap.exists() ? userSnap.data().gameId : user.email;
    sellerDisplay.textContent = currentGameId;
    loginPrompt.style.display = "none";
    form.style.display = "flex";
  });

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    if (!currentUser) return;

    submitBtn.disabled = true;
    submitBtn.textContent = "등록 중...";

    const job = jobSelect.value;
    const qty = Number(document.getElementById("qty").value);
    const condition = document.getElementById("condition").value.trim();

    try {
      await addDoc(collection(db, "auctionListings"), {
        job,
        qty,
        sellerUid: currentUser.uid,
        sellerGameId: currentGameId,
        condition,
        offerCount: 0,
        status: "open",
        createdAt: serverTimestamp(),
      });
      window.location.href = `list.html?job=${encodeURIComponent(job)}`;
    } catch (err) {
      console.error(err);
      alert("등록 중 오류가 발생했습니다: " + err.message);
      submitBtn.disabled = false;
      submitBtn.textContent = "판매글 등록";
    }
  });
</script>

</body>
</html>
