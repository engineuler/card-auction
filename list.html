<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>직업별 경매장 — 카드 경매</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500;1,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<header class="site-header">
  <div class="site-header__inner">
    <div>
      <div class="site-mark">
        <span class="site-mark__lot">LOT</span>
        <h1 class="site-title"><a href="index.html">야시장 — <em>카드 경매</em></a></h1>
      </div>
      <p class="site-tagline" id="jobTagline">직업 판매글 목록</p>
    </div>
    <nav class="nav-links">
      <a href="index.html">전체 직업</a>
      <a href="mypage.html">마이페이지</a>
    </nav>
  </div>
</header>

<main class="wrap">
  <div class="section-head">
    <div>
      <h2 id="jobTitle">직업</h2>
      <p>등록된 판매글을 골라 제안을 걸어보세요.</p>
    </div>
    <a class="btn btn--gold" id="writeLink" href="write.html">판매글 등록</a>
  </div>

  <div id="listingArea">
    <div class="empty-state">
      <p class="empty-state__title">아직 등록된 판매글이 없습니다.</p>
      <p class="empty-state__desc">이 직업의 첫 판매자가 되어보세요.</p>
    </div>
  </div>
</main>

<script type="module">
  const params = new URLSearchParams(window.location.search);
  const job = params.get("job") || "직업 미상";

  document.title = `${job} — 카드 경매`;
  document.getElementById("jobTitle").textContent = job;
  document.getElementById("jobTagline").textContent = `${job} 판매글 목록`;
  document.getElementById("writeLink").href = `write.html?job=${encodeURIComponent(job)}`;

  // TODO: Firestore 연동 후 이 자리에서 판매글 목록을 불러와 렌더링
</script>

</body>
  </html>
