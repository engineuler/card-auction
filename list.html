<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>직업별 경매장 — 그림자 경매</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&family=Noto+Serif+KR:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<header class="site-header">
  <div class="site-header__inner">
    <div class="site-mark">
      <span class="site-mark__seal">品</span>
      <h1 class="site-title"><a href="index.html">그림자 <em>경매</em><small>카드 암시장</small></a></h1>
    </div>
    <nav class="nav-links">
      <a href="index.html">전체 직업</a>
      <a href="mypage.html">마이페이지</a>
    </nav>
  </div>
</header>

<main class="wrap">
  <div class="section-head">
    <div>
      <h2 id="jobTitle">직업</h2>
      <p>등록된 판매글을 골라 제안을 걸어보세요.</p>
    </div>
    <a class="btn btn--gold" id="writeLink" href="write.html">판매글 등록</a>
  </div>

  <div id="listingArea">
    <div class="empty-state">
      <p class="empty-state__title">불러오는 중...</p>
    </div>
  </div>
</main>

<script type="module">
  import { db, collection, query, where, orderBy, onSnapshot } from "./js/firebase-init.js";

  const params = new URLSearchParams(window.location.search);
  const job = params.get("job") || "직업 미상";

  document.title = `${job} — 그림자 경매`;
  document.getElementById("jobTitle").textContent = job;
  document.getElementById("writeLink").href = `write.html?job=${encodeURIComponent(job)}`;

  const listingArea = document.getElementById("listingArea");

  const q = query(
    collection(db, "auctionListings"),
    where("job", "==", job),
    orderBy("createdAt", "desc")
  );

  onSnapshot(
    q,
    (snapshot) => {
      if (snapshot.empty) {
        listingArea.innerHTML = `
          <div class="empty-state">
            <p class="empty-state__title">아직 등록된 판매글이 없습니다.</p>
            <p class="empty-state__desc">이 직업의 첫 판매자가 되어보세요.</p>
          </div>
        `;
        return;
      }

      const list = document.createElement("div");
      list.className = "listing-list";

      snapshot.forEach((docSnap) => {
        const data = docSnap.data();
        const item = document.createElement("a");
        item.className = "listing-item";
        item.href = `detail.html?id=${docSnap.id}`;
        item.innerHTML = `
          <div>
            <div class="listing-item__seller">${data.sellerName || "익명"}</div>
            <div class="listing-item__qty">판매 수량 ${data.qty ?? "?"}장</div>
          </div>
          <div class="listing-item__offers">제안 ${data.offerCount ?? 0}건</div>
        `;
        list.appendChild(item);
      });

      listingArea.innerHTML = "";
      listingArea.appendChild(list);
    },
    (err) => {
      console.error(err);
      listingArea.innerHTML = `
        <div class="empty-state">
          <p class="empty-state__title">목록을 불러오지 못했습니다.</p>
          <p class="empty-state__desc">${err.message}</p>
        </div>
      `;
    }
  );
</script>

</body>
</html>
