<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>그림자 경매 — 카드 암시장</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&family=Noto+Serif+KR:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<header class="site-header">
  <div class="site-header__inner">
    <div class="site-mark">
      <span class="site-mark__seal">品</span>
      <h1 class="site-title">그림자 <em>경매</em><small>카드 암시장</small></h1>
    </div>
    <nav class="nav-links">
      <a href="mypage.html">마이페이지</a>
    </nav>
  </div>
</header>

<main class="wrap">
  <div class="section-head">
    <div>
      <h2>직업별 경매장</h2>
      <p>원하는 직업을 골라 판매글을 둘러보세요.</p>
    </div>
  </div>

  <div class="job-grid" id="jobGrid"></div>
</main>

<script type="module">
  import { JOBS } from "./data/jobs.js";

  const grid = document.getElementById("jobGrid");

  JOBS.forEach((job, i) => {
    const card = document.createElement("a");
    card.className = "job-card";
    card.href = `list.html?job=${encodeURIComponent(job)}`;
    card.innerHTML = `
      <span class="job-card__index">제 ${String(i + 1).padStart(2, "0")} 호</span>
      <span class="job-card__name">${job}</span>
      <span class="job-card__count">판매글 0건</span>
    `;
    grid.appendChild(card);
  });
</script>

</body>
</html>
